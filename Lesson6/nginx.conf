http {
    # 1. Nhóm 3 Backend Server để Load Balancing
    upstream ecommerce_backend {
        # Round Robin mặc định
        server 127.0.0.1:8080 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8081 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8082 max_fails=2 fail_timeout=10s;
    }

    # 2. Subdomain Admin
    server {
        listen 80;
        server_name admin.my-ecommerce.com;

        location / {
            proxy_pass http://127.0.0.1:4000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. Domain chính - API Load Balancing
    server {
        listen 80;
        server_name my-ecommerce.com www.my-ecommerce.com;

        location /api/ {
            proxy_pass http://ecommerce_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}